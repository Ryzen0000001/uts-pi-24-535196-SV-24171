server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nama service Docker "backend" dipakai langsung sebagai upstream.
    # resolver 127.0.0.11 adalah DNS internal Docker Compose; alamat IP
    # container tidak pernah ditulis di konfigurasi.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /up {
        proxy_pass $backend/up;
        proxy_set_header Host $host;
    }

    # Vue Router memakai history mode: semua rute non-berkas diarahkan ke index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|png|jpe?g|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
